
name: RaceDay CI

on:
  push:
    branches:
      - main
      - Part2-development
      - Part3-development
  pull_request:
    branches:
      - main
      - Part2-development
      - Part3-development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API and test dependencies
        run: dotnet restore RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

      - name: Restore MVC dependencies
        run: dotnet restore RaceDayMVC/RaceDayMVC.csproj

      - name: Build API
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --no-restore --configuration Release

      - name: Build MVC
        run: dotnet build RaceDayMVC/RaceDayMVC.csproj --no-restore --configuration Release

      - name: Run API tests
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release --no-restore

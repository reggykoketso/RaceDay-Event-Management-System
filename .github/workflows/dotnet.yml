name: RaceDay API CI

on:
  push:
    branches:
      - main
      - part-2-restful-api
  pull_request:
    branches:
      - main
      - part-2-restful-api

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

    - name: Build
      run: dotnet build RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --no-build --configuration Release